<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDAA - Rajsamand District Assessment</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      max-width: 360px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #ecfdf5;
      color: #059669;
      font-weight: 700;
      font-size: 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      font-weight: 800;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 14px 20px;
      background: #059669;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }
    button:active {
      transform: scale(0.98);
      background: #047857;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">RDAA Portal</div>
    <h1>Connecting to Assessment Server</h1>
    <p>Please ensure you are connected to the internet to access test papers and submit assessments.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
