<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d97706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rajsamand Portal" />
    <meta name="description" content="Rajsamand District Assessment Portal with candidate login, AI test paper parsing to MCQs, automated grading, performance analytics, downloadable progress reports, and Resend email notifications." />
    <meta property="og:title" content="Rajsamand District Assessment Portal" />
    <meta property="og:description" content="Rajsamand District Assessment Portal with candidate login, AI test paper parsing to MCQs, automated grading, performance analytics, downloadable progress reports, and Resend email notifications." />
    <title>Rajsamand District Assessment Portal</title>
    <!-- Official Typography: Plus Jakarta Sans, Outfit, Noto Sans Devanagari, JetBrains Mono, and Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system, sans-serif; padding: 24px;">
        <div style="text-align: center; max-width: 420px; width: 100%;">
          <div style="width: 48px; height: 48px; border: 3px solid #334155; border-top-color: #d97706; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;"></div>
          <h1 style="font-size: 20px; font-weight: 800; color: #f8fafc; margin: 0 0 6px 0; letter-spacing: -0.025em; font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;">Rajsamand Assessment Portal</h1>
          <p style="font-size: 13px; color: #94a3b8; margin: 0;">Department of Information Technology & Communication (DoIT&C)</p>
          <p style="font-size: 12px; color: #64748b; margin-top: 16px; font-family: 'Cinzel', serif; letter-spacing: 0.05em; text-transform: uppercase;">Government of Rajasthan</p>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
